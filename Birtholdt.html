<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Audio Messages</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 40px 20px;
            background: #f5f5f5;
        }

        h1 {
            margin-bottom: 30px;
        }

        button {
            padding: 12px 22px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 8px;
        }

        #recordBtn {
            background: #222;
            color: white;
        }

        #submitBtn {
            background: #2196f3;
            color: white;
            display: none;
        }

        #status {
            margin: 20px 0;
            font-size: 16px;
        }

        #audioPreview {
            display: none;
            width: 100%;
            max-width: 400px;
            margin: 20px auto;
        }
    </style>
    <style>
    body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, sans-serif;
        color: #eef2ff;
        background:
            radial-gradient(circle at 50% 0%, #1d2a52 0%, #0b1224 45%, #060b16 100%);
        padding: 40px 20px;
        box-sizing: border-box;
    }

    body > * {
        box-sizing: border-box;
    }

    h1 {
        text-align: center;
        font-size: clamp(2.2rem, 7vw, 4rem);
        margin: 20px 0 35px;
        color: #f5f7ff;
    }

    #greetingsList {
        max-width: 760px;
        margin: 35px auto;
    }

    #greetingsList > div {
        background: rgba(18, 29, 55, 0.75);
        border: 1px solid rgba(120, 145, 210, 0.25);
        border-radius: 18px;
        padding: 18px 20px;
        margin-bottom: 16px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
    }

    #greetingsList h3 {
        margin: 0 0 12px;
        font-size: 1.05rem;
        color: #dce5ff;
    }

    #greetingsList audio {
        width: 100%;
        height: 42px;
    }
    </style>
</head>

<body>

    <h1>Record a Message </h1>

    <button id="recordBtn">🎙️ Record</button>

    <p id="status">Press Record to start.</p>

    <audio id="audioPreview" controls></audio>

    <br>

    <button id="submitBtn">📤 Submit</button>

    <div id="greetingsList"></div>
    
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://wpkxfkxdflaujxgcgnas.supabase.co";
const SUPABASE_KEY = "sb_publishable_U4fIpKJ40XrJ6-zCMtdYPQ_v2Kr3Mut"; 

const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);
</script>
    
    <script>

        const recordBtn = document.getElementById("recordBtn");
        const submitBtn = document.getElementById("submitBtn");
        const audioPreview = document.getElementById("audioPreview");
        const status = document.getElementById("status");

        let mediaRecorder;
        let audioChunks = [];
        let audioBlob;
        let audioURL;


        recordBtn.addEventListener("click", async () => {

            // START RECORDING
            if (!mediaRecorder || mediaRecorder.state === "inactive") {

                try {

                    const stream =
                        await navigator.mediaDevices.getUserMedia({
                            audio: true
                        });

                    audioChunks = [];

                    mediaRecorder = new MediaRecorder(stream);

                    mediaRecorder.ondataavailable = (event) => {

                        if (event.data.size > 0) {
                            audioChunks.push(event.data);
                        }

                    };


                    mediaRecorder.onstop = () => {

                        audioBlob = new Blob(
                            audioChunks,
                            { type: "audio/webm" }
                        );

                        audioURL = URL.createObjectURL(audioBlob);

                        audioPreview.src = audioURL;
                        audioPreview.style.display = "block";

                        submitBtn.style.display = "inline-block";

                        status.textContent =
                            "Recording finished. You can listen to it.";

                    };


                    mediaRecorder.start();

                    recordBtn.textContent = "⏹️ Stop Recording";

                    status.textContent = "🔴 Recording...";

                    // Stop microphone access
                    mediaRecorder.onstop = (() => {

                        const originalStop = mediaRecorder.onstop;

                        return () => {

                            stream.getTracks().forEach(track => {
                                track.stop();
                            });

                            audioBlob = new Blob(
                                audioChunks,
                                { type: "audio/webm" }
                            );

                            audioURL =
                                URL.createObjectURL(audioBlob);

                            audioPreview.src = audioURL;
                            audioPreview.style.display = "block";

                            submitBtn.style.display = "inline-block";

                            status.textContent =
                                "Recording finished. You can listen to it.";

                        };

                    })();

                }

                catch (error) {

                    console.error(error);

                    status.textContent =
                        "Microphone permission was denied or unavailable.";

                }

            }


            // STOP RECORDING
            else if (mediaRecorder.state === "recording") {

                mediaRecorder.stop();

                recordBtn.textContent = "🎙️ Record Again";

            }

        });


        // SUBMIT BUTTON
        submitBtn.addEventListener("click", async () => {

    if (!audioBlob) {
        return;
    }

    status.textContent = "⏳ Uploading Message...";

    const fileName =
        `greeting_${Date.now()}.webm`;

    const uploadPromise = supabaseClient
    .storage
    .from("greetings")
    .upload(fileName, audioBlob, {
        contentType: audioBlob.type || "audio/webm"
    });

const timeoutPromise = new Promise((_, reject) =>
    setTimeout(() => reject(new Error("Upload timed out")), 10000)
);

let uploadResult;

try {
    uploadResult = await Promise.race([
        uploadPromise,
        timeoutPromise
    ]);
} catch (error) {
    console.error(error);
    status.textContent = "❌ " + error.message;
    return;
}

const { error: uploadError } = uploadResult;

    if (uploadError) {
        console.error(uploadError);
        status.textContent =
            "❌" +
            uploadError.message ;
        return;
    }

    const { error: databaseError } =
        await supabaseClient
            .from("greetings")
            .insert({
                audio_path: fileName
            });

    if (databaseError) {
        console.error(databaseError);
        status.textContent =
            "❌ Recording uploaded, but saving failed.";
        return;
    }

    status.textContent =
        "✅ Message submitted!";

});
        const greetingsList = document.getElementById("greetingsList");

async function loadGreetings() {

    const { data, error } = await supabaseClient
        .from("greetings")
        .select("audio_path")
        .order("id", { ascending: true });

    if (error) {
        console.error(error);
        return;
    }

    greetingsList.innerHTML = "";

    data.forEach((greeting, index) => {

        const container = document.createElement("div");

        const title = document.createElement("h3");
        title.textContent =
            `🎙️ ${index + 1}${getOrdinal(index + 1)} Message`;

        const audio = document.createElement("audio");
        audio.controls = true;

        const { data: publicURL } =
            supabaseClient
                .storage
                .from("greetings")
                .getPublicUrl(greeting.audio_path);

        audio.src = publicURL.publicUrl;

        container.appendChild(title);
        container.appendChild(audio);

        greetingsList.appendChild(container);
    });
}

function getOrdinal(number) {

    if (number % 100 >= 11 && number % 100 <= 13) {
        return "th";
    }

    switch (number % 10) {
        case 1: return "st";
        case 2: return "nd";
        case 3: return "rd";
        default: return "th";
    }
}

loadGreetings();
    </script>

</body>
</html>
